name: Claude Code Fix

on:
  issue_comment:
    types: [created]

jobs:
  claude-fix:
    if: |
      contains(github.event.comment.body, '/fix') &&
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout supergannt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup magic
        uses: ./.github/actions/setup-magic
        with:
          magic-token: ${{ secrets.MAGIC_TOKEN }}
          bearer-token: ${{ secrets.MAGIC_BEARER_TOKEN }}

      - name: Resolve PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.issue.number;

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('number', prNumber);
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_ref', pr.head.ref);

      - name: Checkout PR branch
        run: |
          git fetch origin ${{ steps.pr.outputs.head_ref }}
          git checkout ${{ steps.pr.outputs.head_ref }}

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch latest review for PR
        id: comments
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const prNumber = ${{ steps.pr.outputs.number }};
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const issueComments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: prNumber, per_page: 100 },
            );

            const inlineComments = await github.paginate(
              github.rest.pulls.listReviewComments,
              { owner, repo, pull_number: prNumber, per_page: 100 },
            );

            const formalReviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number: prNumber, per_page: 100 },
            );

            const isClaudeReviewComment = (body) =>
              typeof body === 'string' &&
              /##\s*(?:🤖\s*)?Claude Code Review\b/i.test(body);

            const claudeReviewComments = issueComments
              .filter((c) => isClaudeReviewComment(c.body))
              .sort(
                (a, b) =>
                  new Date(b.created_at).getTime() -
                  new Date(a.created_at).getTime(),
              );

            const formalWithBody = formalReviews
              .filter((r) => typeof r.body === 'string' && r.body.trim())
              .sort(
                (a, b) =>
                  new Date(b.submitted_at || b.created_at || 0).getTime() -
                  new Date(a.submitted_at || a.created_at || 0).getTime(),
              );

            const latestClaude = claudeReviewComments[0] || null;
            const latestFormal = formalWithBody[0] || null;

            let source = 'none';
            let reviewMarkdown = '';
            let reviewMeta = {};

            if (latestClaude) {
              source = 'claude_issue_comment';
              reviewMarkdown = latestClaude.body;
              reviewMeta = {
                id: latestClaude.id,
                user: latestClaude.user?.login,
                created_at: latestClaude.created_at,
                html_url: latestClaude.html_url,
              };
            } else if (latestFormal) {
              source = 'pull_request_review';
              reviewMarkdown = latestFormal.body;
              reviewMeta = {
                id: latestFormal.id,
                user: latestFormal.user?.login,
                created_at: latestFormal.submitted_at,
                html_url: latestFormal.html_url,
                state: latestFormal.state,
              };
            }

            if (!reviewMarkdown.trim()) {
              core.setFailed(
                'No Claude Code Review (or formal PR review body) found on this PR. Run /review first.',
              );
              return;
            }

            const inline = inlineComments.map((c) => ({
              id: c.id,
              path: c.path,
              line: c.line,
              side: c.side,
              body: c.body,
              user: c.user?.login,
              created_at: c.created_at,
              in_reply_to_id: c.in_reply_to_id,
              html_url: c.html_url,
            }));

            fs.writeFileSync('/tmp/latest-review.md', reviewMarkdown);
            fs.writeFileSync(
              '/tmp/latest-review-meta.json',
              JSON.stringify(
                {
                  source,
                  ...reviewMeta,
                  inline_count: inline.length,
                  claude_review_comment_count: claudeReviewComments.length,
                },
                null,
                2,
              ),
            );
            fs.writeFileSync(
              '/tmp/pr-inline-comments.json',
              JSON.stringify(inline, null, 2),
            );

            // Keep a raw dump for debugging, but Claude should use latest-review.md.
            fs.writeFileSync(
              '/tmp/pr-comments.json',
              JSON.stringify(
                {
                  latest_review_source: source,
                  latest_review_meta: reviewMeta,
                  inline,
                },
                null,
                2,
              ),
            );

            core.setOutput('review_source', source);
            core.setOutput('review_bytes', String(Buffer.byteLength(reviewMarkdown)));
            console.log(
              `Latest review source=${source} bytes=${Buffer.byteLength(reviewMarkdown)} inline=${inline.length}`,
            );

      - name: Run Claude Code fix
        id: claude
        env:
          ANTHROPIC_BASE_URL: http://127.0.0.1:11434/anthropic
          ANTHROPIC_API_KEY: unused
          ANTHROPIC_AUTH_TOKEN: unused
          CLAUDE_CODE_GLOB_NO_IGNORE: "false"
        run: |
          set +e
          PROMPT="You are fixing EVERY finding from the latest code review on this PR. \
            PR: base \`${{ steps.pr.outputs.base_ref }}\` ← head \`${{ steps.pr.outputs.head_ref }}\`. \
            Base SHA: ${{ steps.pr.outputs.base_sha }}, Head SHA: ${{ steps.pr.outputs.head_sha }}. \
            \
            PRIMARY INPUT (read entirely first): /tmp/latest-review.md \
            This is the full latest Claude Code Review comment for this PR (source=${{ steps.comments.outputs.review_source }}, ${{ steps.comments.outputs.review_bytes }} bytes). \
            ALSO read /tmp/pr-inline-comments.json if it is non-empty (inline diff comments). \
            Meta: /tmp/latest-review-meta.json. \
            \
            Working directory is the git repo root. Prefer Write/Edit on disk; printed diffs are optional fallback. \
            Do not read node_modules, dist, data, logs, magic/, package-lock.json, wasm, or binary files. \
            \
            Hard rules: \
            1) Parse /tmp/latest-review.md completely. Collect EVERY actionable item from sections like \"Issues Found\", \"Suggestions\", numbered lists, and any \"must/should/fix/add/remove/normalize\" requests. \
            2) Treat Suggestions as mandatory work items too — do NOT skip them as \"not a bug\" or \"optional\". \
            3) For each item: implement the change with Write/Edit (tests included when requested). SKIPPED is allowed ONLY when the current code already fully satisfies the item — prove it with a short Read quote. Never SKIPPED an unimplemented suggestion. \
            4) Do not stop after cosmetic/dead-code fixes if tests or other items remain. \
            5) Do not use the Agent tool / subagents. \
            6) When finished, print exactly this trailer: \
            FIX_CHECKLIST: \
            - [DONE|SKIPPED] <short item>: <one-line proof> \
            (one bullet per review item) \
            FIX_SUMMARY: <one line covering all items>"

          MAX_ATTEMPTS=8
          CLAUDE_EXIT=1
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "==== Claude fix attempt ${attempt}/${MAX_ATTEMPTS} ===="
            claude -p --dangerously-skip-permissions --max-turns 999999 \
              "$PROMPT" > fix-output.md 2>&1
            CLAUDE_EXIT=$?
            BYTES=$(wc -c < fix-output.md | tr -d ' ')
            echo "claude_exit=${CLAUDE_EXIT} bytes=${BYTES}"
            # Transient upstream / bearer lock — wait and retry in the same job.
            if grep -qiE 'rate-limited|429|Overloaded|all bearers are|API Error: Request rejected' fix-output.md \
              && ! grep -qE 'FIX_CHECKLIST:|FIX_SUMMARY:' fix-output.md; then
              WAIT=$(( attempt * 180 ))
              echo "::warning::Rate-limit/API error on attempt ${attempt}; sleeping ${WAIT}s"
              sleep "$WAIT"
              continue
            fi
            break
          done

          echo "claude_exit=${CLAUDE_EXIT}" >> "$GITHUB_OUTPUT"
          if [ "$CLAUDE_EXIT" -ne 0 ]; then
            echo "::warning::Claude exited with code ${CLAUDE_EXIT}"
            tail -80 fix-output.md || true
          fi

          # Print-mode often edits files then ends without the required trailer.
          # Second turn: force a checklist against the latest review + current diff.
          if ! grep -qE 'FIX_CHECKLIST:' fix-output.md; then
            echo "==== Checklist follow-up (no FIX_CHECKLIST in first turn) ===="
            git diff --stat "${{ steps.pr.outputs.base_sha }}...HEAD" > /tmp/fix-diff-stat.txt || true
            git diff "${{ steps.pr.outputs.base_sha }}...HEAD" > /tmp/fix-diff.txt || true
            {
              echo ""
              echo "==== CHECKLIST FOLLOW-UP ===="
            } >> fix-output.md
            claude -p --dangerously-skip-permissions --max-turns 20 \
              "Do NOT edit files. Read /tmp/latest-review.md (full latest review) and /tmp/fix-diff-stat.txt plus /tmp/fix-diff.txt (what changed on the PR branch vs base). \
              Emit ONLY this trailer covering EVERY Issues Found + Suggestions item from the review: \
              FIX_CHECKLIST: \
              - [DONE|SKIPPED] <item>: <one-line proof from the diff or current code> \
              FIX_SUMMARY: <one line> \
              DONE only if clearly addressed. SKIPPED only if already satisfied before this PR — never SKIPPED unimplemented work." \
              >> fix-output.md 2>&1 \
              || echo "::warning::checklist follow-up Claude exited non-zero"
          fi

          # Keep the job going so we can still commit partial disk edits / post logs.
          true
          set -e

      - name: Apply printed diffs (fallback)
        run: |
          # Accept both ```diff and ```diff path fences; never fail on empty output under bash -e.
          awk '/^```diff($| )/{flag=1; next} /^```$/{flag=0} flag' fix-output.md > fixes.patch || true
          if [ -s fixes.patch ]; then
            git apply fixes.patch || git apply --3way fixes.patch || true
            echo "attempted to apply printed diffs"
          else
            echo "no printed diffs"
          fi

      - name: Extract fix summary
        id: fix
        run: |
          SUMMARY=$(grep -o 'FIX_SUMMARY:.*' fix-output.md | sed 's/FIX_SUMMARY://' | head -1 || true)
          if [ -z "$SUMMARY" ]; then
            SUMMARY=$(head -5 fix-output.md | tr '\n' ' ')
          fi
          {
            echo "summary<<EOF"
            echo "$SUMMARY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push fixes
        run: |
          git config user.name "Claude Code"
          git config user.email "claude@anthropic.com"
          # Plain git add -A; CI artifacts are in .gitignore.
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"
          else
            git commit -m "Apply Claude Code fixes from review"
            git push origin ${{ steps.pr.outputs.head_ref }}
            echo "NO_CHANGES=false" >> "$GITHUB_ENV"
          fi

      - name: Fail if review was not addressed
        run: |
          if [ ! -f fix-output.md ]; then
            echo "::error::missing fix-output.md"
            exit 1
          fi
          echo "---- FIX_CHECKLIST (if any) ----"
          awk 'BEGIN{p=0} /^FIX_CHECKLIST:/{p=1} p{print} /^FIX_SUMMARY:/{if(p) exit}' fix-output.md || true
          if grep -qiE 'rate-limited|all bearers are' fix-output.md \
            && ! grep -qE 'FIX_CHECKLIST:|FIX_SUMMARY:' fix-output.md; then
            echo "::error::Claude never got past rate-limit; no FIX_CHECKLIST produced"
            tail -40 fix-output.md || true
            exit 1
          fi
          if ! grep -qE 'FIX_CHECKLIST:' fix-output.md; then
            echo "::error::FIX_CHECKLIST missing — latest review may not have been fully processed"
            tail -80 fix-output.md || true
            exit 1
          fi
          DONE_COUNT=$(grep -cE '^\- \[DONE\]' fix-output.md || true)
          SKIP_COUNT=$(grep -cE '^\- \[SKIPPED\]' fix-output.md || true)
          echo "done=${DONE_COUNT} skipped=${SKIP_COUNT} no_changes=${NO_CHANGES:-}"
          if [ "${DONE_COUNT:-0}" -lt 1 ] && [ "${SKIP_COUNT:-0}" -lt 1 ]; then
            echo "::error::FIX_CHECKLIST has no DONE/SKIPPED bullets"
            exit 1
          fi
          # Any SKIPPED that admits the work was not done should fail the job.
          if grep -E '^\- \[SKIPPED\].*(no |not |still |missing|unimplemented|absent)' fix-output.md; then
            echo "::error::Checklist still has unimplemented SKIPPED items — re-run /fix after addressing them"
            exit 1
          fi

      - name: Post fix comment to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');

            let summary;
            let checklist = '';
            try {
              const raw = fs.readFileSync('fix-output.md', 'utf8');
              const match = raw.match(/FIX_SUMMARY:\s*(.*)/);
              summary = match ? match[1] : raw.substring(0, 500).trim();
              const cStart = raw.indexOf('FIX_CHECKLIST:');
              const cEnd = raw.indexOf('FIX_SUMMARY:');
              if (cStart !== -1) {
                checklist = raw
                  .slice(cStart, cEnd === -1 ? undefined : cEnd)
                  .trim();
              }
            } catch (e) {
              summary = 'Fix completed but no output was captured.';
            }

            const hasChanges = process.env.NO_CHANGES !== 'true';
            const body = [
              '## 🔧 Claude Code Fix',
              '',
              hasChanges
                ? `*Fixes applied and pushed to \`${{ steps.pr.outputs.head_ref }}\`*`
                : '*No changes needed*',
              '',
              checklist ? `${checklist}\n` : '',
              summary,
            ]
              .filter(Boolean)
              .join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr.outputs.number }},
              body: body
            });

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-fix-logs
          path: |
            fix-output.md
            /tmp/magic-proxy.log
            /tmp/magic-data/traffic-log.jsonl*
            /tmp/latest-review.md
            /tmp/latest-review-meta.json
            /tmp/pr-inline-comments.json
            /tmp/pr-comments.json
