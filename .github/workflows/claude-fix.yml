name: Claude Code Fix

on:
  issue_comment:
    types: [created]

jobs:
  claude-fix:
    if: |
      contains(github.event.comment.body, '/fix') &&
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout supergannt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout obossyk (master)
        uses: actions/checkout@v4
        with:
          repository: yeswolf/obossyk
          ref: master
          path: obossyk
          token: ${{ secrets.MAGIC_TOKEN }}

      - name: Resolve PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.issue.number;

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('number', prNumber);
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_ref', pr.head.ref);

      - name: Checkout PR branch
        run: |
          git fetch origin ${{ steps.pr.outputs.head_ref }}
          git checkout ${{ steps.pr.outputs.head_ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build obossyk proxy
        run: |
          cd obossyk
          npm ci
          npm run build

      - name: Create credentials for obossyk
        env:
          DATA_DIR: /tmp/obossyk-data
        run: |
          mkdir -p "$DATA_DIR"
          echo '{"token":"${{ secrets.DEEPSEEK_BEARER_TOKEN }}","userInfo":{},"savedAt":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}' > "$DATA_DIR/credentials.json"

      - name: Start obossyk proxy
        env:
          DATA_DIR: /tmp/obossyk-data
        run: |
          cd obossyk
          nohup node dist/main.js > /tmp/obossyk-proxy.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/health >/dev/null 2>&1; then
              echo "proxy ready"
              exit 0
            fi
            sleep 0.5
          done
          echo "proxy failed to start" >&2
          tail -40 /tmp/obossyk-proxy.log >&2
          exit 1

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch review comments from PR
        id: comments
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};

            const reviewComments = await github.rest.pulls.listReviewComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const issueComments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const allComments = [
              ...reviewComments.data.map(c => ({
                type: 'review',
                path: c.path,
                line: c.line,
                body: c.body,
                user: c.user.login,
              })),
              ...issueComments.data.map(c => ({
                type: 'issue',
                body: c.body,
                user: c.user.login,
              })),
            ];

            const fs = require('node:fs');
            fs.writeFileSync('/tmp/pr-comments.json', JSON.stringify(allComments, null, 2));
            console.log(`Fetched ${allComments.length} comments`);

      - name: Run Claude Code fix
        env:
          ANTHROPIC_BASE_URL: http://127.0.0.1:11434/anthropic
          ANTHROPIC_API_KEY: unused
          ANTHROPIC_AUTH_TOKEN: unused
          CLAUDE_CODE_GLOB_NO_IGNORE: "false"
        run: |
          claude -p --dangerously-skip-permissions --max-turns 30 \
            "You are fixing issues found in a code review. The PR is: \
            base branch \`${{ steps.pr.outputs.base_ref }}\`, head branch \`${{ steps.pr.outputs.head_ref }}\`. \
            Base SHA: ${{ steps.pr.outputs.base_sha }}, Head SHA: ${{ steps.pr.outputs.head_sha }}. \
            The file /tmp/pr-comments.json contains review comments from this PR. \
            Do not read node_modules, dist, data, logs, package-lock.json, wasm, or binary files. \
            Your task: \
            1) Read /tmp/pr-comments.json and extract every bug/issue mentioned in review comments \
            2) For each issue, output a unified diff patch that fixes it \
            3) Skip comments that are not bugs (questions, praise, suggestions you disagree with) \
            4) Format your response so each fix is a separate code block starting with \`\`\`diff on its own line \
            5) After all diffs, output a one-line summary starting with FIX_SUMMARY: listing each fix" \
            > fix-output.md 2>&1

      - name: Apply fixes via patch
        run: |
          awk '/^```diff$/,/^```$/' fix-output.md | grep -v '^```' > fixes.patch
          if [ -s fixes.patch ]; then
            git apply fixes.patch
            echo "PATCH_APPLIED=true" >> $GITHUB_ENV
          else
            echo "no patches to apply"
            echo "PATCH_APPLIED=false" >> $GITHUB_ENV
          fi

      - name: Extract fix summary
        id: fix
        run: |
          SUMMARY=$(grep -o 'FIX_SUMMARY:.*' fix-output.md | sed 's/FIX_SUMMARY://' | head -1)
          if [ -z "$SUMMARY" ]; then
            SUMMARY=$(head -5 fix-output.md | tr '\n' ' ')
          fi
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

      - name: Commit and push fixes
        run: |
          git config user.name "Claude Code"
          git config user.email "claude@anthropic.com"
          git add -u
          if git diff --cached --quiet; then
            echo "no changes to commit"
            echo "NO_CHANGES=true" >> $GITHUB_ENV
          else
            git commit -m "Apply Claude Code fixes from review"
            git push origin ${{ steps.pr.outputs.head_ref }}
            echo "NO_CHANGES=false" >> $GITHUB_ENV
          fi

      - name: Post fix comment to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');

            let summary;
            try {
              const raw = fs.readFileSync('fix-output.md', 'utf8');
              const match = raw.match(/FIX_SUMMARY:\s*(.*)/);
              summary = match ? match[1] : raw.substring(0, 500).trim();
            } catch (e) {
              summary = 'Fix completed but no output was captured.';
            }

            const hasChanges = process.env.NO_CHANGES !== 'true';
            const body = hasChanges
              ? `## 🔧 Claude Code Fix\n\n*Fixes applied and pushed to \`${{ steps.pr.outputs.head_ref }}\`*\n\n${summary}`
              : `## 🔧 Claude Code Fix\n\n*No changes needed*\n\n${summary}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr.outputs.number }},
              body: body
            });

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-fix-logs
          path: |
            fix-output.md
            /tmp/obossyk-proxy.log
            /tmp/obossyk-data/traffic-log.jsonl
            /tmp/pr-comments.json
