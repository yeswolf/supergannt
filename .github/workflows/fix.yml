name: Fix

# Loop protocol (GitHub comment reactions — not body markers):
#   Review 👀 (eyes)  → needs fixes → this workflow (via dispatch or /fix)
#   Review 👍 (+1)    → clean → do not fix
#   Fix 🚀 (rocket)   → changes pushed → dispatch Review
#   Fix 👀 (eyes)     → no commits; re-check → dispatch Review
#   Fix 😕 (confused) → capacity; self-retry
# Slash command /fix still works.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to fix from latest review'
        required: true
        type: string

jobs:
  fix:
    concurrency:
      group: magic-agent
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Resolve PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            if (context.eventName === 'issue_comment') {
              prNumber = context.payload.issue.number;
            } else {
              prNumber = Number(core.getInput('pr_number') || process.env.PR_NUMBER);
            }
            if (!prNumber) {
              core.setFailed('Missing PR number');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput('skip', 'false');
            core.setOutput('number', String(prNumber));
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_ref', pr.head.ref);
        env:
          PR_NUMBER: ${{ inputs.pr_number }}

      - name: Checkout supergannt
        if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup magic
        if: steps.pr.outputs.skip != 'true'
        uses: ./.github/actions/setup-magic
        with:
          magic-token: ${{ secrets.MAGIC_TOKEN }}
          bearer-token: ${{ secrets.MAGIC_BEARER_TOKEN }}

      - name: Checkout PR branch
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.MAGIC_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git fetch origin ${{ steps.pr.outputs.head_ref }}
          git fetch origin ${{ steps.pr.outputs.base_ref }}
          git checkout ${{ steps.pr.outputs.head_ref }}

      - name: Install supergannt deps
        if: steps.pr.outputs.skip != 'true'
        run: |
          # Prefer lockfile; legacy-peer-deps covers older PR branches still on esbuild 0.25.
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Detect allow_github for this PR
        if: steps.pr.outputs.skip != 'true'
        id: scope
        run: |
          # Hard ban: Claude never edits .github/ (even if the PR already touches it).
          echo "allow_github=false" >> "$GITHUB_OUTPUT"
          echo "allow_github=false"

      - name: Install CLI
        if: steps.pr.outputs.skip != 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch latest review for PR
        if: steps.pr.outputs.skip != 'true'
        id: comments
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const prNumber = Number('${{ steps.pr.outputs.number }}');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const isSlashFix =
              context.eventName === 'issue_comment' &&
              /(?:^|\s)\/fix(?:\s|$)/.test(context.payload.comment?.body || '');

            const issueComments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: prNumber, per_page: 100 },
            );

            const inlineComments = await github.paginate(
              github.rest.pulls.listReviewComments,
              { owner, repo, pull_number: prNumber, per_page: 100 },
            );

            const isReviewComment = (body) =>
              typeof body === 'string' && /^##\s*Review\b/m.test(body);

            const reviewComments = issueComments
              .filter((c) => isReviewComment(c.body))
              .sort(
                (a, b) =>
                  new Date(b.created_at).getTime() -
                  new Date(a.created_at).getTime(),
              );

            const latest = reviewComments[0];
            if (!latest?.body?.trim()) {
              core.setFailed('No review comment found on this PR. Wait for review or run /review.');
              return;
            }

            // Decide by reaction on the review comment (👍 = clean, 👀 = needs fix).
            const { data: reactions } = await github.rest.reactions.listForIssueComment({
              owner,
              repo,
              comment_id: latest.id,
              per_page: 100,
            });
            const contents = new Set(reactions.map((r) => r.content));
            const isClean = contents.has('+1') && !contents.has('eyes');
            const isNeeds = contents.has('eyes');

            if (!isSlashFix && isClean && !isNeeds) {
              core.setOutput('skip_clean', 'true');
              console.log(`Latest review ${latest.id} has 👍 — nothing to fix`);
              fs.writeFileSync('/tmp/latest-review.md', latest.body);
              return;
            }

            const inline = inlineComments.map((c) => ({
              id: c.id,
              path: c.path,
              line: c.line,
              body: c.body,
              user: c.user?.login,
            }));

            fs.writeFileSync('/tmp/latest-review.md', latest.body);
            fs.writeFileSync(
              '/tmp/latest-review-meta.json',
              JSON.stringify(
                {
                  id: latest.id,
                  user: latest.user?.login,
                  created_at: latest.created_at,
                  html_url: latest.html_url,
                  reactions: [...contents],
                  inline_count: inline.length,
                },
                null,
                2,
              ),
            );
            fs.writeFileSync('/tmp/pr-inline-comments.json', JSON.stringify(inline, null, 2));
            core.setOutput('skip_clean', 'false');
            core.setOutput('review_bytes', String(Buffer.byteLength(latest.body)));
            console.log(`Using review comment ${latest.id} reactions=[${[...contents]}]`);

      - name: Merge base into PR if conflicted
        if: steps.pr.outputs.skip != 'true' && steps.comments.outputs.skip_clean != 'true'
        id: merge_base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          MERGEABLE=""
          STATE=""
          for i in 1 2 3 4 5; do
            JSON=$(gh pr view "${{ steps.pr.outputs.number }}" --repo "$GH_REPO" --json mergeable,mergeStateStatus)
            MERGEABLE=$(echo "$JSON" | jq -r '.mergeable')
            STATE=$(echo "$JSON" | jq -r '.mergeStateStatus')
            if [ "$MERGEABLE" != "UNKNOWN" ] && [ "$MERGEABLE" != "null" ]; then
              break
            fi
            sleep 3
          done
          echo "mergeable=${MERGEABLE} mergeStateStatus=${STATE}"
          echo "mergeable=${MERGEABLE}" >> "$GITHUB_OUTPUT"
          echo "mergeable_state=${STATE}" >> "$GITHUB_OUTPUT"

          NEED_MERGE=false
          # mergeable: MERGEABLE | CONFLICTING | UNKNOWN
          # mergeStateStatus: CLEAN | DIRTY | BEHIND | BLOCKED | ...
          if [ "$MERGEABLE" = "CONFLICTING" ] || [ "$STATE" = "DIRTY" ]; then
            NEED_MERGE=true
          fi
          if [ -f /tmp/latest-review.md ] && grep -qiE 'conflict|конфликт' /tmp/latest-review.md; then
            NEED_MERGE=true
          fi

          if [ "$NEED_MERGE" != "true" ]; then
            echo "No merge-base step needed"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "had_conflicts=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge --no-edit "origin/${{ steps.pr.outputs.base_ref }}"
          MERGE_EXIT=$?
          if [ "$MERGE_EXIT" -eq 0 ]; then
            echo "Clean merge of base into PR head"
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "had_conflicts=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Merge stopped with conflicts — leaving markers for the Fix agent"
          git diff --name-only --diff-filter=U | tee /tmp/conflict-paths.txt
          {
            echo "## Must fix — merge conflicts"
            echo ""
            echo "Merge of origin/${{ steps.pr.outputs.base_ref }} into this PR left conflict markers in:"
            sed 's/^/- /' /tmp/conflict-paths.txt
            echo ""
            echo "Resolve EVERY <<<<<<< ======= >>>>>>> marker."
            echo "Keep functionality from BOTH master and this PR branch."
            echo "Do NOT git merge --abort. Leave the merge in progress; CI will commit."
            echo ""
          } > /tmp/merge-conflict-instructions.md
          cat /tmp/merge-conflict-instructions.md /tmp/latest-review.md > /tmp/latest-review-merged.md
          mv /tmp/latest-review-merged.md /tmp/latest-review.md
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "had_conflicts=true" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run fix
        if: steps.pr.outputs.skip != 'true' && steps.comments.outputs.skip_clean != 'true'
        id: agent
        env:
          ANTHROPIC_BASE_URL: http://127.0.0.1:11434/anthropic
          ANTHROPIC_API_KEY: unused
          ANTHROPIC_AUTH_TOKEN: unused
          CLAUDE_CODE_GLOB_NO_IGNORE: "false"
        run: |
          set +e
          ALLOW_GITHUB="${{ steps.scope.outputs.allow_github }}"
          CONFLICT_HINT=""
          if [ "${{ steps.merge_base.outputs.had_conflicts }}" = "true" ]; then
            CONFLICT_HINT="MERGE IN PROGRESS with conflict markers on disk. Resolve them with Edit/Write before anything else. Do not abort the merge."
          elif [ "${{ steps.merge_base.outputs.merged }}" = "true" ]; then
            CONFLICT_HINT="Base was already merged cleanly into this branch; commit will include that merge if not pushed yet."
          fi
          PROMPT="/ci-fix
          Fix every finding from /tmp/latest-review.md.
          Also read /tmp/pr-inline-comments.json if non-empty.
          PR: base \`${{ steps.pr.outputs.base_ref }}\` ← head \`${{ steps.pr.outputs.head_ref }}\`.
          Base SHA: ${{ steps.pr.outputs.base_sha }}, Head SHA: ${{ steps.pr.outputs.head_sha }}.
          allow_github=false — NEVER modify anything under .github/.
          ${CONFLICT_HINT}
          Working directory is the git repo root (PR branch; npm install already done)."

          DISALLOW_TOOLS="TaskCreate,TaskUpdate,TaskList,TaskGet,TaskOutput,Agent,TodoWrite"
          SYS_FILE="/tmp/ci-fix-sys.md"
          cat magic/.claude/skills/ci-fix/SKILL.md ci/personas/fix.md > "$SYS_FILE"

          printf '%s\n' "$PROMPT" | claude -p --dangerously-skip-permissions --max-turns 999999 \
            --add-dir magic \
            --append-system-prompt-file "$SYS_FILE" \
            --disallowed-tools "$DISALLOW_TOOLS" \
            > fix-output.md 2>&1
          AGENT_EXIT=$?
          BYTES=$(wc -c < fix-output.md | tr -d ' ')
          echo "agent_exit=${AGENT_EXIT} bytes=${BYTES} allow_github=${ALLOW_GITHUB}"
          echo "agent_exit=${AGENT_EXIT}" >> "$GITHUB_OUTPUT"

          if ! grep -qE 'FIX_CHECKLIST:' fix-output.md; then
            echo "==== Checklist follow-up ===="
            git diff --stat "${{ steps.pr.outputs.base_sha }}...HEAD" > /tmp/fix-diff-stat.txt || true
            git diff "${{ steps.pr.outputs.base_sha }}...HEAD" > /tmp/fix-diff.txt || true
            echo "" >> fix-output.md
            echo "==== CHECKLIST FOLLOW-UP ====" >> fix-output.md
            printf '%s\n' "Do NOT edit files. Read /tmp/latest-review.md and /tmp/fix-diff-stat.txt plus /tmp/fix-diff.txt. Emit ONLY: FIX_CHECKLIST: - [DONE|SKIPPED] <item>: <proof> FIX_SUMMARY: <one sentence> SKIPPED only if already satisfied (say already)." \
              | claude -p --dangerously-skip-permissions --max-turns 20 \
              --add-dir magic \
              --disallowed-tools "$DISALLOW_TOOLS" \
              >> fix-output.md 2>&1 || true
          fi
          true
          set -e

      - name: Apply printed diffs (fallback)
        if: steps.pr.outputs.skip != 'true' && steps.comments.outputs.skip_clean != 'true'
        run: |
          awk '/^```diff($| )/{flag=1; next} /^```$/{flag=0} flag' fix-output.md > fixes.patch || true
          if [ -s fixes.patch ]; then
            git apply fixes.patch || git apply --3way fixes.patch || true
          fi

      - name: Commit and push fixes
        if: steps.pr.outputs.skip != 'true' && steps.comments.outputs.skip_clean != 'true'
        id: commit
        env:
          # PAT: same as implement — GITHUB_TOKEN cannot push workflow file changes.
          GH_TOKEN: ${{ secrets.MAGIC_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          HEAD_REF="${{ steps.pr.outputs.head_ref }}"
          START_SHA="${{ steps.pr.outputs.head_sha }}"

          # Agent Write/Edit updates the working tree but often skips `git add`.
          # During a merge, paths stay unmerged until staged — mark resolved ones.
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if [ -f "$f" ] && ! grep -qE '^<<<<<<< |^>>>>>>> ' "$f"; then
              echo "Marking resolved (no markers): $f"
              git add -- "$f"
            fi
          done < <(git diff --name-only --diff-filter=U)

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Unresolved merge conflicts remain after Fix agent"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=magic \
              -e '^<<<<<<< ' -e '^>>>>>>> ' . 2>/dev/null | head -20 | grep -q .; then
            echo "::error::Conflict markers still present in the tree"
            grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=magic \
              -e '^<<<<<<< ' -e '^>>>>>>> ' . | head -40
            exit 1
          fi

          git add -A
          ARTIFACTS=(
            implement-output.md implement-output-retry.md
            fix-output.md review.md review-output.md fixes.patch
          )
          echo "Unstaging .github (Claude must not change workflows/actions)"
          git reset -q -- .github "${ARTIFACTS[@]}" 2>/dev/null || true

          MADE_COMMIT=false
          if ! git diff --cached --quiet; then
            git commit -m "$(bash .github/scripts/commit-msg-from-summary.sh 'fix: ' fix-output.md 'fix: address review feedback')"
            MADE_COMMIT=true
          fi

          NOW_SHA=$(git rev-parse HEAD)
          if [ "$NOW_SHA" = "$START_SHA" ]; then
            if [ "${{ steps.merge_base.outputs.had_conflicts }}" = "true" ]; then
              echo "::error::Conflict merge was started but nothing was committed"
              exit 1
            fi
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Local HEAD moved (agent commit and/or clean merge commit) — push.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git push origin "$HEAD_REF"
          echo "pushed ${START_SHA:0:7}..${NOW_SHA:0:7} made_commit=${MADE_COMMIT}"
          echo "NO_CHANGES=false" >> "$GITHUB_ENV"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Post fix comment + reaction
        if: always() && steps.pr.outputs.skip != 'true' && steps.comments.outputs.skip_clean != 'true'
        id: post
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const prNumber = Number('${{ steps.pr.outputs.number }}');
            const hasChanges = '${{ steps.commit.outputs.has_changes }}' === 'true';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Reaction protocol:
            //   rocket   🚀 → pushed changes → kick Review
            //   eyes     👀 → no commits; re-check → kick Review
            const REACT_APPLIED = 'rocket';
            const REACT_CHECKED = 'eyes';

            let raw = '';
            try {
              raw = fs.readFileSync('fix-output.md', 'utf8');
            } catch {
              raw = '';
            }

            const summaryMatch = raw.match(/FIX_SUMMARY:\s*(.*)/);
            let summary = summaryMatch ? summaryMatch[1].trim() : '';

            const looksLikeNoise =
              /rate-limited|API Error:|all bearers are|Request rejected|Overloaded|too frequent/i.test(
                raw,
              ) && !/FIX_SUMMARY:|FIX_CHECKLIST:/.test(raw);

            async function postWithReaction(body, reaction) {
              const { data: comment } = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
              await github.rest.reactions.createForIssueComment({
                owner,
                repo,
                comment_id: comment.id,
                content: reaction,
              });
              return comment;
            }

            if (looksLikeNoise) {
              await postWithReaction(
                [
                  '## Fixes',
                  '',
                  'Could not finish applying the review on this pass.',
                ].join('\n'),
                REACT_CHECKED,
              );
              core.setOutput('status', 'failed');
              return;
            }

            const bullets = [];
            for (const line of raw.split(/\r?\n/)) {
              const m = line.match(/^\- \[(DONE|SKIPPED)\]\s*(.+)$/i);
              if (m) {
                const kind = m[1].toUpperCase();
                const text = m[2].replace(/:\s*/, ' — ').trim();
                bullets.push(
                  kind === 'DONE' ? `- Done: ${text}` : `- Already covered: ${text}`,
                );
              }
            }

            if (!summary) {
              summary = hasChanges
                ? 'Pushed fixes for the latest review.'
                : 'Checked the latest review — no further code changes were needed.';
            }

            const parts = ['## Fixes', '', summary];
            if (bullets.length) {
              parts.push('', ...bullets);
            }
            if (hasChanges) {
              parts.push('', 'Pushed to the PR branch.');
            } else {
              parts.push('', 'No new commits.');
            }

            const reaction = hasChanges ? REACT_APPLIED : REACT_CHECKED;
            await postWithReaction(parts.join('\n'), reaction);
            core.setOutput('status', hasChanges ? 'applied' : 'noop');


      - name: Dispatch review after fix
        if: steps.post.outputs.status == 'applied' || steps.post.outputs.status == 'noop'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'review.yml',
              ref: 'master',
              inputs: { pr_number: '${{ steps.pr.outputs.number }}' },
            });
            console.log('Dispatched review after fix (${{ steps.post.outputs.status }}) for PR ${{ steps.pr.outputs.number }}');

      - name: Upload logs
        if: always() && steps.pr.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fix-logs
          path: |
            fix-output.md
            /tmp/magic-proxy.log
            /tmp/magic-data/traffic-log.jsonl*
            /tmp/latest-review.md
            /tmp/latest-review-meta.json
            /tmp/pr-inline-comments.json
          if-no-files-found: warn
