name: Claude Code Merge

# Triggered by /merge slash command, workflow_dispatch, or automatically
# when review is marked as complete (👍 / STATUS_CLEAN).

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to squash-merge'
        required: true
        type: string

concurrency:
  group: claude-merge-pr-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  claude-merge:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '/merge') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Resolve PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            if (context.eventName === 'issue_comment') {
              prNumber = context.payload.issue.number;
            } else {
              prNumber = Number(core.getInput('pr_number') || process.env.PR_NUMBER);
            }
            if (!prNumber) {
              core.setFailed('Missing PR number');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.merged) {
              core.setOutput('skip', 'true');
              core.info(`PR #${prNumber} is already merged`);
              return;
            }

            if (pr.state !== 'open') {
              core.setOutput('skip', 'true');
              core.info(`PR #${prNumber} is ${pr.state} — skipping merge`);
              return;
            }

            core.setOutput('skip', 'false');
            core.setOutput('number', String(prNumber));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('title', pr.title);
        env:
          PR_NUMBER: ${{ inputs.pr_number }}

      - name: Checkout supergannt
        if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR branch
        if: steps.pr.outputs.skip != 'true'
        run: |
          git fetch origin ${{ steps.pr.outputs.head_ref }}

      - name: Squash and merge PR
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.MAGIC_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          HEAD_REF="${{ steps.pr.outputs.head_ref }}"
          PR_TITLE="${{ steps.pr.outputs.title }}"

          # Configure git with magic token for push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          echo "Squash-merging PR #${PR_NUMBER}: ${PR_TITLE}"

          # Squash-merge via gh CLI — this squashes all commits and merges to base
          # without generating a merge commit message (--squash + manual commit).
          set +e
          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch \
            --subject "${PR_TITLE} (#${PR_NUMBER})" \
            --body ""
          MERGE_EXIT=$?
          set -e
          if [ "$MERGE_EXIT" -ne 0 ]; then
            echo "::error::gh pr merge failed with exit code $MERGE_EXIT"
            exit $MERGE_EXIT
          fi

          echo "PR #${PR_NUMBER} squash-merged successfully"

      - name: Post merge confirmation
        if: steps.pr.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number('${{ steps.pr.outputs.number }}');
            const prTitle = ${{ toJSON(steps.pr.outputs.title) }};

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `✅ Squash-merged \`${prTitle}\` into master.`,
            });

      - name: Skip message
        if: steps.pr.outputs.skip == 'true'
        run: echo "Skipping merge — PR is already merged or closed"
