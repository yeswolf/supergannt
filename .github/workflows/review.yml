name: Review

# Loop protocol (GitHub comment reactions — not body markers):
#   Review 👀 (eyes)  → needs fixes → dispatch Fix
#   Review 👍 (+1)    → clean → stop
#   Review 😕 (confused) → capacity; self-retry
#   Fix 🚀 (rocket)   → changes pushed → dispatch Review
#   Fix 👀 (eyes)     → no commits; re-check → dispatch Review
# Slash command /review still works.

on:
  # No synchronize: Actions pushes from Fix often land as action_required, and Fix
  # already dispatches review after 🚀/👀. Use /review for manual re-checks.
  pull_request:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

jobs:
  review:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (
        github.event.action == 'opened' ||
        github.event.action == 'reopened' ||
        github.event.action == 'ready_for_review'
      ) && (
        github.event.pull_request.user.login == github.repository_owner ||
        github.event.pull_request.user.login == 'github-actions[bot]' ||
        github.event.pull_request.user.login == 'claude'
      ))
    concurrency:
      group: magic-agent
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Resolve PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
            } else if (context.eventName === 'issue_comment') {
              prNumber = context.payload.issue.number;
            } else {
              prNumber = Number(core.getInput('pr_number') || process.env.PR_NUMBER);
            }
            if (!prNumber) {
              core.setFailed('Missing PR number');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput('skip', 'false');
            core.setOutput('number', String(prNumber));
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_ref', pr.head.ref);
        env:
          PR_NUMBER: ${{ inputs.pr_number }}

      - name: Collect failed Tests checks
        if: steps.pr.outputs.skip != 'true'
        id: ci_tests
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = '${{ steps.pr.outputs.head_sha }}';
            const isTestCheck = (name) =>
              /^(vitest|tests)$/i.test(name) || /\bvitest\b/i.test(name) || /^Tests\b/i.test(name);
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            async function listTestChecks() {
              const { data } = await github.rest.checks.listForRef({
                owner,
                repo,
                ref: headSha,
                per_page: 100,
              });
              return (data.check_runs || []).filter((c) => isTestCheck(c.name));
            }

            async function hasActiveTestsRun() {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                head_sha: headSha,
                per_page: 30,
              });
              return (data.workflow_runs || []).some(
                (r) =>
                  (r.name === 'Tests' || /\/tests\.yml$/.test(r.path || '')) &&
                  ['queued', 'pending', 'in_progress', 'waiting', 'requested'].includes(
                    r.status,
                  ),
              );
            }

            // Wait only while Tests is actually running/queued. If nothing is
            // scheduled (e.g. history wiped, or Tests never fired), do not hang.
            const deadline = Date.now() + 12 * 60 * 1000;
            let checks = await listTestChecks();
            let emptyStreak = 0;
            while (Date.now() < deadline) {
              checks = await listTestChecks();
              const pending = checks.some(
                (c) => c.status !== 'completed' || c.conclusion === null,
              );
              const activeRun = pending ? true : await hasActiveTestsRun();

              if (checks.length === 0 && !activeRun) {
                emptyStreak += 1;
                // One short retry in case the check is still registering, then bail.
                if (emptyStreak >= 2) {
                  core.info(
                    'No Tests checks/runs for this head SHA — skipping CI test gate',
                  );
                  break;
                }
                await sleep(5000);
                continue;
              }

              emptyStreak = 0;
              if (!pending && !activeRun) break;

              core.info(
                `Waiting for Tests: checks=${checks
                  .map((c) => `${c.name}=${c.status}/${c.conclusion || '…'}`)
                  .join(', ') || '(none)'} activeRun=${activeRun}`,
              );
              await sleep(15000);
            }

            const failed = checks.filter((c) =>
              ['failure', 'timed_out', 'cancelled', 'action_required'].includes(
                c.conclusion,
              ),
            );

            if (!failed.length) {
              fs.writeFileSync('/tmp/ci-test-failures.md', '');
              core.setOutput('has_failures', 'false');
              core.info('No failed Tests/vitest checks on head SHA');
              return;
            }

            const lines = [];
            for (const c of failed) {
              lines.push(
                `- **${c.name}** — \`${c.conclusion}\`${c.html_url ? ` ([log](${c.html_url}))` : ''}`,
              );
              const title = c.output?.title;
              const summary = c.output?.summary;
              if (title) lines.push(`  - ${title}`);
              if (summary) {
                const clipped = String(summary).replace(/\s+/g, ' ').trim().slice(0, 400);
                if (clipped) lines.push(`  - ${clipped}`);
              }
            }

            fs.writeFileSync('/tmp/ci-test-failures.md', lines.join('\n') + '\n');
            core.setOutput('has_failures', 'true');
            core.warning(`Failed Tests checks:\n${lines.join('\n')}`);

      - name: Detect merge conflicts
        if: steps.pr.outputs.skip != 'true'
        id: conflicts
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = Number('${{ steps.pr.outputs.number }}');
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            // mergeable is null while GitHub computes — poll briefly.
            let pr = null;
            for (let i = 0; i < 8; i++) {
              const { data } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              });
              pr = data;
              if (pr.mergeable !== null && pr.mergeable !== undefined) break;
              core.info(`Waiting for mergeable computation (state=${pr.mergeable_state})`);
              await sleep(3000);
            }

            const hardConflict =
              pr.mergeable === false || pr.mergeable_state === 'dirty';

            if (!hardConflict) {
              fs.writeFileSync('/tmp/ci-merge-conflicts.md', '');
              core.setOutput('has_conflicts', 'false');
              core.info(
                `No merge conflicts (mergeable=${pr.mergeable}, state=${pr.mergeable_state})`,
              );
              return;
            }

            const lines = [
              `- PR #${prNumber} **не мержится в \`${pr.base.ref}\`** (\`mergeable=${pr.mergeable}\`, \`mergeable_state=${pr.mergeable_state}\`).`,
              '- Разрулить конфликты с базовой веткой и запушить в head.',
            ];

            fs.writeFileSync('/tmp/ci-merge-conflicts.md', lines.join('\n') + '\n');
            core.setOutput('has_conflicts', 'true');
            core.warning(lines.join('\n'));

      - name: Checkout supergannt
        if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout PR branch
        if: steps.pr.outputs.skip != 'true'
        run: |
          git fetch origin ${{ steps.pr.outputs.head_ref }}
          git fetch origin ${{ steps.pr.outputs.base_ref }}
          git checkout ${{ steps.pr.outputs.head_ref }}

      - name: List conflict paths (best effort)
        if: steps.pr.outputs.skip != 'true' && steps.conflicts.outputs.has_conflicts == 'true'
        run: |
          set +e
          git merge-tree $(git merge-base origin/${{ steps.pr.outputs.base_ref }} HEAD) origin/${{ steps.pr.outputs.base_ref }} HEAD \
            > /tmp/merge-tree.txt 2>/dev/null
          # Conflicted files show as "changed in both"
          {
            echo ""
            echo "Конфликтные пути (merge-tree):"
            grep -E '^(changed in both|CONFLICT)' /tmp/merge-tree.txt | head -40 || true
            # Also try a throwaway merge for path list
            git merge --no-commit --no-ff origin/${{ steps.pr.outputs.base_ref }} >/tmp/merge-try.txt 2>&1
            if [ -f .git/MERGE_HEAD ]; then
              git diff --name-only --diff-filter=U | while read -r f; do
                echo "- \`$f\`"
              done >> /tmp/ci-merge-conflicts.md
              git merge --abort 2>/dev/null || true
            fi
          } >> /tmp/ci-merge-conflicts.md
          cat /tmp/ci-merge-conflicts.md
          set -e

      - name: Setup magic
        if: steps.pr.outputs.skip != 'true'
        uses: ./.github/actions/setup-magic
        with:
          magic-token: ${{ secrets.MAGIC_TOKEN }}
          bearer-token: ${{ secrets.MAGIC_BEARER_TOKEN }}

      - name: Install CLI
        if: steps.pr.outputs.skip != 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Prepare PR diff
        if: steps.pr.outputs.skip != 'true'
        run: |
          git diff --stat ${{ steps.pr.outputs.base_sha }}...${{ steps.pr.outputs.head_sha }} > /tmp/pr-stat.txt
          git diff ${{ steps.pr.outputs.base_sha }}...${{ steps.pr.outputs.head_sha }} > /tmp/pr.diff
          if [ "$(wc -c < /tmp/pr.diff)" -gt 500000 ]; then
            head -c 500000 /tmp/pr.diff > /tmp/pr.diff.trimmed
            echo -e "\n\n[diff truncated to 500KB]" >> /tmp/pr.diff.trimmed
            mv /tmp/pr.diff.trimmed /tmp/pr.diff
          fi

      - name: Run review
        if: steps.pr.outputs.skip != 'true'
        id: agent
        env:
          ANTHROPIC_BASE_URL: http://127.0.0.1:11434/anthropic
          ANTHROPIC_API_KEY: unused
          ANTHROPIC_AUTH_TOKEN: unused
          CLAUDE_CODE_GLOB_NO_IGNORE: "false"
        run: |
          set +e
          PROMPT="/ci-review
          Review PR base \`${{ steps.pr.outputs.base_ref }}\` ← head \`${{ steps.pr.outputs.head_ref }}\`.
          Base SHA: ${{ steps.pr.outputs.base_sha }}, Head SHA: ${{ steps.pr.outputs.head_sha }}.
          Diff summary: /tmp/pr-stat.txt. Full diff: /tmp/pr.diff.
          Voice: toxic sharp senior — substance first, then at least one dry joke/sarcasm in the prose. No corporate flat tone."

          DISALLOW_TOOLS="TaskCreate,TaskUpdate,TaskList,TaskGet,TaskOutput,Agent,TodoWrite"
          SYS_FILE="/tmp/ci-review-sys.md"
          # Persona last so voice wins over generic skill tone.
          cat magic/.claude/skills/ci-review/SKILL.md ci/personas/review.md > "$SYS_FILE"
          echo "==== sys prompt (persona tail) ===="
          tail -20 "$SYS_FILE"

          printf '%s\n' "$PROMPT" | claude -p --dangerously-skip-permissions --max-turns 999999 \
            --add-dir magic \
            --append-system-prompt-file "$SYS_FILE" \
            --disallowed-tools "$DISALLOW_TOOLS" \
            > review.md 2>&1
          AGENT_EXIT=$?
          BYTES=$(wc -c < review.md | tr -d ' ')
          echo "agent_exit=${AGENT_EXIT} bytes=${BYTES}"
          echo "agent_exit=${AGENT_EXIT}" >> "$GITHUB_OUTPUT"
          true
          set -e

      - name: Post review comment + reaction
        id: post
        if: always() && steps.pr.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const prNumber = Number('${{ steps.pr.outputs.number }}');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Reaction protocol (visible under the comment):
            //   eyes     👀 → needs fixes → kick Fix
            //   +1       👍 → clean → stop
            //   confused 😕 → capacity → self-retry
            const REACT_NEEDS = 'eyes';
            const REACT_CLEAN = '+1';

            let raw = '';
            try {
              raw = fs.readFileSync('review.md', 'utf8');
            } catch {
              raw = '';
            }

            const looksLikeApiNoise = (text) =>
              /rate-limited|API Error:|all bearers are|Request rejected|Overloaded|too frequent/i.test(text) &&
              !/STATUS_CLEAN|STATUS_NEEDS_FIXES/.test(text);

            async function postWithReaction(body, reaction) {
              const { data: comment } = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
              await github.rest.reactions.createForIssueComment({
                owner,
                repo,
                comment_id: comment.id,
                content: reaction,
              });
              return comment;
            }

            if (looksLikeApiNoise(raw) || !raw.trim()) {
              await postWithReaction(
                [
                  '## Review',
                  '',
                  'Could not finish the review on this pass.',
                ].join('\n'),
                REACT_NEEDS,
              );
              core.setOutput('status', 'failed');
              return;
            }

            let reaction = REACT_NEEDS;
            if (/\bSTATUS_CLEAN\b/.test(raw) && !/\bSTATUS_NEEDS_FIXES\b/.test(raw)) {
              reaction = REACT_CLEAN;
            } else if (/\bSTATUS_NEEDS_FIXES\b/.test(raw)) {
              reaction = REACT_NEEDS;
            }

            let prose = raw
              .replace(/\bSTATUS_CLEAN\b/g, '')
              .replace(/\bSTATUS_NEEDS_FIXES\b/g, '')
              .replace(/\bREVIEW_CLEAN\b/g, '')
              .replace(/\bREVIEW_NEEDS_CHANGES\b/g, '')
              .replace(/\bREVIEW_START\b/g, '')
              .trim();

            // Drop short "thinking aloud" openers only — never strip on markdown `---`
            // (agents often put an HR before the closing summary; that used to delete
            // the whole review and leave only the epilogue on the PR comment).
            prose = prose
              .replace(
                /^(?:Now I have[^\n]*\n|Let me (?:compose|write|start)[^\n]*\n)+/i,
                '',
              )
              .replace(/^(?:Okay[,.]?|Alright[,.]?|Sure[,.]?)\s*/i, '')
              .trim();

            if (!prose) {
              prose =
                reaction === REACT_CLEAN
                  ? 'Looks good — I do not see anything else that needs code changes.'
                  : 'I found a few things worth fixing before merge.';
            }

            // Hard gates from CI (not the agent): failed tests and/or merge conflicts.
            const mustFix = [];
            let testFailures = '';
            try {
              testFailures = fs.readFileSync('/tmp/ci-test-failures.md', 'utf8').trim();
            } catch {
              testFailures = '';
            }
            if (testFailures) {
              mustFix.push(
                'Упали тесты в CI workflow — починить до мержа:',
                '',
                testFailures,
              );
            }
            let mergeConflicts = '';
            try {
              mergeConflicts = fs.readFileSync('/tmp/ci-merge-conflicts.md', 'utf8').trim();
            } catch {
              mergeConflicts = '';
            }
            if (mergeConflicts) {
              if (mustFix.length) mustFix.push('');
              mustFix.push(
                'Есть merge conflicts с базовой веткой — обязательно разрулить:',
                '',
                mergeConflicts,
              );
            }
            if (mustFix.length) {
              reaction = REACT_NEEDS;
              prose = [
                '### Обязательно исправить',
                '',
                ...mustFix,
                '',
                '---',
                '',
                prose,
              ].join('\n');
            }

            await postWithReaction(['## Review', '', prose].join('\n'), reaction);
            core.setOutput('status', reaction === REACT_CLEAN ? 'clean' : 'needs');


      - name: Dispatch fix after review needs changes
        if: steps.post.outputs.status == 'needs'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'fix.yml',
              ref: '${{ steps.pr.outputs.base_ref }}',
              inputs: { pr_number: '${{ steps.pr.outputs.number }}' },
            });
            console.log('Dispatched fix after 👀 review for PR ${{ steps.pr.outputs.number }}');

      # TEMP: auto-merge after clean review disabled — re-enable when ready.
      # - name: Dispatch merge after review clean
      #   if: steps.post.outputs.status == 'clean'
      #   uses: actions/github-script@v7
      #   with:
      #     script: |
      #       const baseRef = '${{ steps.pr.outputs.base_ref }}';
      #       if (baseRef !== 'master') {
      #         core.warning(
      #           `PR base ref is "${baseRef}", not "master". ` +
      #           `Merge dispatch targets "${baseRef}" — verify this is intentional.`,
      #         );
      #       }
      #       await github.rest.actions.createWorkflowDispatch({
      #         owner: context.repo.owner,
      #         repo: context.repo.repo,
      #         workflow_id: 'merge.yml',
      #         ref: baseRef,
      #         inputs: { pr_number: '${{ steps.pr.outputs.number }}' },
      #       });
      #       console.log('Dispatched merge after 👍 review for PR ${{ steps.pr.outputs.number }}');

      - name: Upload logs
        if: always() && steps.pr.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: review-logs
          path: |
            review.md
            /tmp/magic-proxy.log
            /tmp/magic-data/traffic-log.jsonl*
            /tmp/pr-stat.txt
            /tmp/pr.diff
            /tmp/ci-test-failures.md
            /tmp/ci-merge-conflicts.md
          if-no-files-found: warn
