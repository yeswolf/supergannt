name: Product Manager

on:
  workflow_dispatch:

jobs:
  product-manager:
    concurrency:
      group: magic-agent
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout supergannt
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Setup magic
        uses: ./.github/actions/setup-magic
        with:
          magic-token: ${{ secrets.MAGIC_TOKEN }}
          bearer-token: ${{ secrets.MAGIC_BEARER_TOKEN }}

      - name: Install CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Ensure labels
        env:
          GH_TOKEN: ${{ secrets.MAGIC_TOKEN }}
        run: |
          gh label create task --repo "$GH_REPO" --color 1d76db --description "Ready for Implement workflow" 2>/dev/null || true
          gh label create feature --repo "$GH_REPO" --color 0e8a16 --description "New feature" 2>/dev/null || true
          gh label create enhancement --repo "$GH_REPO" --color a2eeef --description "Improvement to existing behavior" 2>/dev/null || true

      - name: Run product manager
        id: product-manager
        env:
          ANTHROPIC_BASE_URL: http://127.0.0.1:11434/anthropic
          ANTHROPIC_API_KEY: unused
          ANTHROPIC_AUTH_TOKEN: unused
          CLAUDE_CODE_GLOB_NO_IGNORE: "false"
          # PAT required: GITHUB_TOKEN-created issues/labels do not trigger other workflows
          # (no issues.labeled → Implement never starts).
          GH_TOKEN: ${{ secrets.MAGIC_TOKEN }}
        run: |
          set +e

          PROMPT="/ci-product-manager
          Analyze current master of this repository.
          Create exactly 2 new feature issues and 2 improvement issues (4 total).
          Feature issues: labels feature + task.
          Improvement issues: labels enhancement + task.
          No other labels. Detailed body: motivation, user story, acceptance criteria, technical notes.
          Label task auto-starts Implement — do NOT comment /implement.
          Do NOT write any files. Do NOT git add/commit/push. Docs/requirements are the Implementer's job on the feature branch.
          Working directory is the git repo root (read-only analysis).
          When finished print PM_SUMMARY: <issue numbers and titles>."

          # No Write/Edit — PM must not touch the tree; issues only.
          DISALLOW_TOOLS="TaskCreate,TaskUpdate,TaskList,TaskGet,TaskOutput,Agent,TodoWrite,Write,Edit"
          ALLOW_TOOLS="Read,Glob,Grep,Bash"
          SYS_FILE="/tmp/ci-pm-sys.md"
          cat magic/.claude/skills/ci-product-manager/SKILL.md ci/personas/product-manager.md > "$SYS_FILE"

          printf '%s\n' "$PROMPT" | claude -p --dangerously-skip-permissions --max-turns 999999 \
            --add-dir magic \
            --append-system-prompt-file "$SYS_FILE" \
            --allowed-tools "$ALLOW_TOOLS" \
            --disallowed-tools "$DISALLOW_TOOLS" \
            > pm-output.md 2>&1
          AGENT_EXIT=$?

          echo "agent_exit=$AGENT_EXIT" >> "$GITHUB_OUTPUT"
          BYTES=$(wc -c < pm-output.md | tr -d ' ')
          echo "agent_exit=${AGENT_EXIT} bytes=${BYTES}"

          if [ "$AGENT_EXIT" -ne 0 ]; then
            echo "::warning::Agent exited with code $AGENT_EXIT (see pm-output.md)"
            tail -80 pm-output.md || true
            exit "$AGENT_EXIT"
          fi

          set -e
          echo "==== pm-output.md (tail) ===="
          tail -40 pm-output.md || true
