name: Claude Code Implement

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to implement'
        required: true
        type: string

jobs:
  claude-implement:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        contains(github.event.comment.body, '/implement') &&
        github.event.issue.pull_request == null
      )
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Resolve issue number
        id: issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout supergannt
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Load issue details
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE_NUMBER="${{ steps.issue.outputs.number }}"
          gh issue view "$ISSUE_NUMBER" --json title,body,labels > /tmp/issue.json
          TITLE=$(jq -r '.title' /tmp/issue.json)
          jq -r '.body // ""' /tmp/issue.json > /tmp/issue.md
          HAS_TASK=$(jq -r '[.labels[].name] | any(. == "task")' /tmp/issue.json)
          if [ "$HAS_TASK" != "true" ]; then
            echo "Issue #$ISSUE_NUMBER does not have 'task' label" >&2
            cat /tmp/issue.json >&2
            exit 1
          fi
          BRANCH="feature/issue-${ISSUE_NUMBER}-$(echo "$TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//' | cut -c1-40)"
          {
            echo "title<<EOF"
            echo "$TITLE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Loaded issue #$ISSUE_NUMBER → branch $BRANCH"
          echo "---- issue.md ----"
          cat /tmp/issue.md

      - name: Setup magic
        uses: ./.github/actions/setup-magic
        with:
          magic-token: ${{ secrets.MAGIC_TOKEN }}
          bearer-token: ${{ secrets.MAGIC_BEARER_TOKEN }}

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code implement
        id: implement
        env:
          ANTHROPIC_BASE_URL: http://127.0.0.1:11434/anthropic
          ANTHROPIC_API_KEY: unused
          ANTHROPIC_AUTH_TOKEN: unused
          CLAUDE_CODE_GLOB_NO_IGNORE: "false"
        run: |
          ISSUE_TITLE="${{ steps.meta.outputs.title }}"
          BRANCH="${{ steps.meta.outputs.branch }}"
          git checkout -b "$BRANCH"

          PROMPT="Implement the GitHub issue described in /tmp/issue.md. \
            Issue title: ${ISSUE_TITLE}. \
            Working directory is the git repo root. You may create/edit files anywhere except node_modules, dist, data, logs, magic/, and build outputs. \
            Do not read node_modules, dist, data, logs, magic/, package-lock.json, wasm, or binary files. \
            Critical rules: \
            1) Read /tmp/issue.md first and follow its acceptance criteria exactly. Do not invent a different task. \
            2) Within the first 8 tool turns, start writing code with Write/Edit. Exploration is capped: at most 8 Read/Glob/Grep calls before the first Write/Edit. \
            3) Do NOT use the Agent tool. Do NOT spawn subagents. Do NOT use TaskCreate/TaskUpdate at all. \
            4) Prefer Read/Glob/Grep over Bash for file discovery. Do not run long find/ls -R loops. \
            5) Creating a new file requires the Write tool (or an equivalent shell write). Printed diffs alone are not enough. \
            6) Keep going until acceptance criteria are met on disk (source + unit tests), then verify with a short test command if available. \
            7) Never end_turn with only prose or a \"how can I help\" menu — if work remains, call Write/Edit. \
            8) Do not summarize the codebase and stop; implement the issue. \
            9) When finished, print one line starting with IMPLEMENT_SUMMARY: describing what changed."

          set +e
          # Short in-job retries; long waits happen via workflow re-dispatch instead.
          MAX_ATTEMPTS=3
          CLAUDE_EXIT=1
          RATE_LIMITED=false
          traffic_hit_rl() {
            local from_line="${1:-0}"
            if [ ! -f /tmp/magic-data/traffic-log.jsonl ]; then
              return 1
            fi
            tail -n +"$((from_line + 1))" /tmp/magic-data/traffic-log.jsonl 2>/dev/null | \
              grep -qiE 'too frequent|rate_limit_reached|all bearers are rate-limited'
          }
          stdout_hit_rl() {
            grep -qiE 'rate-limited|429|Overloaded|all bearers are|API Error: Request rejected|too frequent' \
              implement-output.md
          }
          has_file_changes() {
            ! git diff --quiet || ! git diff --cached --quiet || \
              [ -n "$(git ls-files --others --exclude-standard)" ]
          }

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "==== Claude implement attempt ${attempt}/${MAX_ATTEMPTS} ===="
            TL_BEFORE=0
            if [ -f /tmp/magic-data/traffic-log.jsonl ]; then
              TL_BEFORE=$(wc -l < /tmp/magic-data/traffic-log.jsonl | tr -d ' ')
            fi
            claude -p --dangerously-skip-permissions --max-turns 999999 \
              "$PROMPT" > implement-output.md 2>&1
            CLAUDE_EXIT=$?
            BYTES=$(wc -c < implement-output.md | tr -d ' ')
            echo "claude_exit=${CLAUDE_EXIT} bytes=${BYTES}"

            HIT_RL=false
            if stdout_hit_rl || traffic_hit_rl "$TL_BEFORE"; then
              HIT_RL=true
              echo "rate-limit detected (stdout and/or traffic-log since line ${TL_BEFORE})"
            fi

            if [ "$HIT_RL" = true ] && ! grep -qE 'IMPLEMENT_SUMMARY:' implement-output.md; then
              if has_file_changes; then
                echo "Rate-limit noise after file changes — continuing with disk state"
                RATE_LIMITED=false
                break
              fi
              RATE_LIMITED=true
              if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                WAIT=$(( 90 * attempt ))
                echo "::warning::Rate-limit on implement attempt ${attempt}; sleeping ${WAIT}s"
                sleep "$WAIT"
                continue
              fi
              echo "::warning::Rate-limit after ${MAX_ATTEMPTS} attempts — will re-dispatch"
              break
            fi

            # Exit 0 with only prose and no files is not success — retry.
            if ! has_file_changes && ! grep -qE 'IMPLEMENT_SUMMARY:' implement-output.md; then
              echo "::warning::Claude produced no file changes (exit=${CLAUDE_EXIT} bytes=${BYTES})"
              if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                WAIT=$(( 30 * attempt ))
                sleep "$WAIT"
                continue
              fi
              # Last attempt empty: treat as soft failure so we re-dispatch rather than silent give-up.
              RATE_LIMITED=true
              break
            fi

            RATE_LIMITED=false
            break
          done
          set -e
          echo "claude_exit=$CLAUDE_EXIT" >> "$GITHUB_OUTPUT"
          echo "rate_limited=$RATE_LIMITED" >> "$GITHUB_OUTPUT"
          if [ "$CLAUDE_EXIT" -ne 0 ]; then
            echo "::warning::Claude exited with code $CLAUDE_EXIT (see implement-output.md)"
            tail -50 implement-output.md || true
            if curl -sf http://127.0.0.1:11434/api/health >/dev/null 2>&1; then
              echo "magic still healthy after Claude failure"
            else
              echo "::error::magic proxy is down after Claude failure"
              tail -80 /tmp/magic-proxy.log || true
            fi
          fi

      - name: Apply printed diffs (fallback)
        run: |
          awk '/^```diff($| )/{flag=1; next} /^```$/{flag=0} flag' implement-output.md > fixes.patch || true
          if [ -s fixes.patch ]; then
            git apply fixes.patch || git apply --3way fixes.patch || true
            echo "attempted to apply printed diffs"
          else
            echo "no printed diffs"
          fi

      - name: Commit and push branch
        id: commit
        run: |
          git config user.name "Claude Code"
          git config user.email "claude@anthropic.com"

          echo "---- working tree after Claude ----"
          git status --short || true

          git add -A

          echo "---- staged ----"
          git diff --cached --stat || true
          git status --short || true

          if git diff --cached --quiet; then
            echo "NO_CHANGES=true" >> "$GITHUB_ENV"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::error::Claude produced no file changes for issue #${{ steps.issue.outputs.number }}"
            exit 1
          fi

          git commit -m "${{ steps.meta.outputs.title }}"
          git push -u origin "${{ steps.meta.outputs.branch }}"
          echo "NO_CHANGES=false" >> "$GITHUB_ENV"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Create PR via gh
        if: steps.commit.outputs.has_changes == 'true'
        id: pr
        env:
          # Prefer MAGIC_TOKEN (PAT): GITHUB_TOKEN cannot create PRs unless the
          # repo setting "Allow GitHub Actions to create and approve pull requests" is on.
          GH_TOKEN: ${{ secrets.MAGIC_TOKEN }}
        run: |
          URL=$(gh pr create --base master --head "${{ steps.meta.outputs.branch }}" \
            --title "${{ steps.meta.outputs.title }}" \
            --body "Closes #${{ steps.issue.outputs.number }}

          🤖 Generated with [Claude Code](https://claude.com/claude-code)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Created PR: $URL"

      - name: Post comment to issue
        if: always()
        id: post
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');

            let raw = '';
            try {
              raw = fs.readFileSync('implement-output.md', 'utf8');
            } catch {
              raw = '';
            }

            const match = raw.match(/IMPLEMENT_SUMMARY:\s*(.*)/);
            let summary = match ? match[1].trim() : '';

            const looksLikeNoise =
              /rate-limited|API Error:|all bearers are|Request rejected|Overloaded|429/i.test(raw) &&
              !/IMPLEMENT_SUMMARY:/.test(raw);
            const rateLimited =
              '${{ steps.implement.outputs.rate_limited }}' === 'true' || looksLikeNoise;

            const hasChanges = '${{ steps.commit.outputs.has_changes }}' === 'true';
            const branch = '${{ steps.meta.outputs.branch }}';
            const issueNumber = ${{ steps.issue.outputs.number }};
            const prUrl = '${{ steps.pr.outputs.url }}';
            const repoUrl = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo;
            const branchUrl = repoUrl + '/tree/' + branch;

            // Never paste raw Claude/API/tool logs into the issue thread.
            if (!hasChanges && rateLimited) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: [
                  '## Implementation',
                  '',
                  'Hit a temporary capacity limit while implementing this issue. I will retry shortly.',
                ].join('\n'),
              });
              core.setOutput('status', 'retry');
              return;
            }

            if (!summary) {
              summary = hasChanges
                ? 'Opened a branch with the first pass on this issue.'
                : 'Could not produce file changes on this pass.';
            }

            let body;
            if (hasChanges) {
              body = [
                '## Implementation',
                '',
                summary,
                '',
                `Branch: [${branch}](${branchUrl})`,
                prUrl ? `PR: ${prUrl}` : null,
              ]
                .filter(Boolean)
                .join('\n');
            } else {
              body = [
                '## Implementation',
                '',
                summary,
                '',
                'No file changes landed this pass — please poke `/implement` again if needed.',
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });
            core.setOutput('status', hasChanges ? 'ok' : 'failed');

      - name: Re-dispatch implement after rate limit
        if: steps.post.outputs.status == 'retry'
        uses: actions/github-script@v7
        with:
          script: |
            await new Promise((r) => setTimeout(r, 120000));
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'claude-implement.yml',
              ref: 'master',
              inputs: { issue_number: '${{ steps.issue.outputs.number }}' },
            });
            console.log('Re-dispatched claude-implement for issue #${{ steps.issue.outputs.number }}');

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-implement-logs
          path: |
            implement-output.md
            /tmp/magic-proxy.log
            /tmp/magic-magic.log
            /tmp/magic-data/traffic-log.jsonl*
            /tmp/issue.md
          if-no-files-found: warn
