name: Claude Code Review

# Loop protocol (GitHub comment reactions — not body markers):
#   Review 👀 (eyes)  → needs fixes → dispatch Fix
#   Review 👍 (+1)    → clean → stop
#   Review 😕 (confused) → capacity; self-retry
#   Fix 🚀 (rocket)   → changes pushed → dispatch Review
#   Fix 👀 (eyes)     → no commits; re-check → dispatch Review
# Slash commands /review and /claude-review still work.

on:
  # No synchronize: Actions pushes from Fix often land as action_required, and Fix
  # already dispatches review after 🚀/👀. Use /review for manual re-checks.
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

concurrency:
  group: claude-loop-pr-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  claude-review:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (
        github.event.action == 'opened' ||
        github.event.action == 'reopened' ||
        github.event.action == 'ready_for_review'
      )) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null && (
          contains(github.event.comment.body, '/review') ||
          contains(github.event.comment.body, '/claude-review')
        ))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    steps:
      - name: Resolve PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
            } else if (context.eventName === 'issue_comment') {
              prNumber = context.payload.issue.number;
            } else {
              prNumber = Number(core.getInput('pr_number') || process.env.PR_NUMBER);
            }
            if (!prNumber) {
              core.setFailed('Missing PR number');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput('skip', 'false');
            core.setOutput('number', String(prNumber));
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_ref', pr.head.ref);
        env:
          PR_NUMBER: ${{ inputs.pr_number }}

      - name: Checkout supergannt
        if: steps.pr.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout PR branch
        if: steps.pr.outputs.skip != 'true'
        run: |
          git fetch origin ${{ steps.pr.outputs.head_ref }}
          git checkout ${{ steps.pr.outputs.head_ref }}

      - name: Setup magic
        if: steps.pr.outputs.skip != 'true'
        uses: ./.github/actions/setup-magic
        with:
          magic-token: ${{ secrets.MAGIC_TOKEN }}
          bearer-token: ${{ secrets.MAGIC_BEARER_TOKEN }}

      - name: Install Claude Code CLI
        if: steps.pr.outputs.skip != 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Prepare PR diff
        if: steps.pr.outputs.skip != 'true'
        run: |
          git diff --stat ${{ steps.pr.outputs.base_sha }}...${{ steps.pr.outputs.head_sha }} > /tmp/pr-stat.txt
          git diff ${{ steps.pr.outputs.base_sha }}...${{ steps.pr.outputs.head_sha }} > /tmp/pr.diff
          if [ "$(wc -c < /tmp/pr.diff)" -gt 500000 ]; then
            head -c 500000 /tmp/pr.diff > /tmp/pr.diff.trimmed
            echo -e "\n\n[diff truncated to 500KB]" >> /tmp/pr.diff.trimmed
            mv /tmp/pr.diff.trimmed /tmp/pr.diff
          fi

      - name: Run Claude Code review
        if: steps.pr.outputs.skip != 'true'
        id: claude
        env:
          ANTHROPIC_BASE_URL: http://127.0.0.1:11434/anthropic
          ANTHROPIC_API_KEY: unused
          ANTHROPIC_AUTH_TOKEN: unused
          CLAUDE_CODE_GLOB_NO_IGNORE: "false"
        run: |
          set +e
          PROMPT="Review this pull request like a careful teammate writing a short PR comment. \
            Base branch \`${{ steps.pr.outputs.base_ref }}\`, head \`${{ steps.pr.outputs.head_ref }}\`. \
            Base SHA: ${{ steps.pr.outputs.base_sha }}, Head SHA: ${{ steps.pr.outputs.head_sha }}. \
            Diff summary: /tmp/pr-stat.txt. Full diff: /tmp/pr.diff. \
            Start from those files; only open more source when needed. \
            Do not read node_modules, dist, data, logs, magic/, package-lock.json, wasm, or binary files. \
            Write a natural, readable review (not a robot dump). Cover: brief summary, concrete issues, concrete suggestions. \
            Do not paste stack traces, API errors, or tool logs. \
            Do not narrate your process (no \"let me review\", \"now I understand\", \"composing\"). Start with the review itself. \
            On the FIRST line of your reply print exactly one of these status tokens (automation only — never shown to humans): \
            STATUS_NEEDS_FIXES — if anything should still be fixed (issues or actionable suggestions). \
            STATUS_CLEAN — if you would approve/merge with no further code changes. \
            Never print both. Prefer STATUS_CLEAN when remaining notes are pure nitpicks you would not block on. \
            After that token, write only the human review prose."

          MAX_ATTEMPTS=3
          CLAUDE_EXIT=1
          RATE_LIMITED=false
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            echo "==== Claude review attempt ${attempt}/${MAX_ATTEMPTS} ===="
            claude -p --dangerously-skip-permissions --max-turns 999999 \
              "$PROMPT" > review.md 2>&1
            CLAUDE_EXIT=$?
            BYTES=$(wc -c < review.md | tr -d ' ')
            echo "claude_exit=${CLAUDE_EXIT} bytes=${BYTES}"
            if grep -qiE 'rate-limited|429|Overloaded|all bearers are|API Error: Request rejected' review.md \
              && ! grep -qE 'STATUS_CLEAN|STATUS_NEEDS_FIXES' review.md; then
              RATE_LIMITED=true
              if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
                WAIT=$(( 60 * attempt ))
                echo "::warning::Rate-limit on review attempt ${attempt}; sleeping ${WAIT}s"
                sleep "$WAIT"
                continue
              fi
              echo "::warning::Rate-limit after ${MAX_ATTEMPTS} attempts — will re-dispatch"
              break
            fi
            RATE_LIMITED=false
            break
          done
          echo "claude_exit=${CLAUDE_EXIT}" >> "$GITHUB_OUTPUT"
          echo "rate_limited=${RATE_LIMITED}" >> "$GITHUB_OUTPUT"
          true
          set -e

      - name: Post review comment + reaction
        id: post
        if: always() && steps.pr.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const prNumber = Number('${{ steps.pr.outputs.number }}');
            const rateLimited = '${{ steps.claude.outputs.rate_limited }}' === 'true';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Reaction protocol (visible under the comment):
            //   eyes     👀 → needs fixes → kick Fix
            //   +1       👍 → clean → stop
            //   confused 😕 → capacity → self-retry
            const REACT_NEEDS = 'eyes';
            const REACT_CLEAN = '+1';
            const REACT_WAIT = 'confused';

            let raw = '';
            try {
              raw = fs.readFileSync('review.md', 'utf8');
            } catch {
              raw = '';
            }

            const looksLikeApiNoise = (text) =>
              /rate-limited|API Error:|all bearers are|Request rejected|Overloaded/i.test(text) &&
              !/STATUS_CLEAN|STATUS_NEEDS_FIXES/.test(text);

            async function postWithReaction(body, reaction) {
              const { data: comment } = await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
              await github.rest.reactions.createForIssueComment({
                owner,
                repo,
                comment_id: comment.id,
                content: reaction,
              });
              return comment;
            }

            if (rateLimited || looksLikeApiNoise(raw) || !raw.trim()) {
              await postWithReaction(
                [
                  '## Review',
                  '',
                  'Hit a temporary capacity limit while reviewing this PR. I will retry shortly.',
                ].join('\n'),
                REACT_WAIT,
              );
              core.setOutput('status', 'retry');
              return;
            }

            let reaction = REACT_NEEDS;
            if (/\bSTATUS_CLEAN\b/.test(raw) && !/\bSTATUS_NEEDS_FIXES\b/.test(raw)) {
              reaction = REACT_CLEAN;
            } else if (/\bSTATUS_NEEDS_FIXES\b/.test(raw)) {
              reaction = REACT_NEEDS;
            }

            let prose = raw
              .replace(/\bSTATUS_CLEAN\b/g, '')
              .replace(/\bSTATUS_NEEDS_FIXES\b/g, '')
              .replace(/\bREVIEW_CLEAN\b/g, '')
              .replace(/\bREVIEW_NEEDS_CHANGES\b/g, '')
              .replace(/\bREVIEW_START\b/g, '')
              .trim();

            // Drop common Claude "thinking aloud" preambles before the real review.
            prose = prose
              .replace(/^[\s\S]*?\n---\s*\n+/m, '')
              .replace(
                /^(?:Now I have[^\n]*\n|Let me (?:compose|write|start)[^\n]*\n)+/i,
                '',
              )
              .replace(/^(?:Okay[,.]?|Alright[,.]?|Sure[,.]?)\s*/i, '')
              .trim();

            if (!prose) {
              prose =
                reaction === REACT_CLEAN
                  ? 'Looks good — I do not see anything else that needs code changes.'
                  : 'I found a few things worth fixing before merge.';
            }

            await postWithReaction(['## Review', '', prose].join('\n'), reaction);
            core.setOutput('status', reaction === REACT_CLEAN ? 'clean' : 'needs');

      - name: Re-dispatch review after rate limit
        if: steps.post.outputs.status == 'retry'
        uses: actions/github-script@v7
        with:
          script: |
            await new Promise((r) => setTimeout(r, 120000));
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'claude-review.yml',
              ref: 'master',
              inputs: { pr_number: '${{ steps.pr.outputs.number }}' },
            });
            console.log('Re-dispatched claude-review for PR ${{ steps.pr.outputs.number }}');

      - name: Dispatch fix after review needs changes
        if: steps.post.outputs.status == 'needs'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'claude-fix.yml',
              ref: 'master',
              inputs: { pr_number: '${{ steps.pr.outputs.number }}' },
            });
            console.log('Dispatched claude-fix after 👀 review for PR ${{ steps.pr.outputs.number }}');

      - name: Upload logs
        if: always() && steps.pr.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-logs
          path: |
            review.md
            /tmp/magic-proxy.log
            /tmp/magic-data/traffic-log.jsonl*
            /tmp/pr-stat.txt
            /tmp/pr.diff
          if-no-files-found: warn
