name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      (github.event_name == 'pull_request' && (
        github.event.action == 'opened' ||
        github.event.action == 'synchronize' ||
        github.event.action == 'reopened' ||
        github.event.action == 'ready_for_review'
      )) ||
      (github.event_name == 'issue_comment' && (
        contains(github.event.comment.body, '/review') ||
        contains(github.event.comment.body, '/claude-review')
      ) && github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout supergannt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup obossyk proxy
        uses: ./.github/actions/setup-obossyk
        with:
          magic-token: ${{ secrets.MAGIC_TOKEN }}
          deepseek-token: ${{ secrets.DEEPSEEK_BEARER_TOKEN }}

      - name: Resolve PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
            } else if (context.eventName === 'issue_comment') {
              prNumber = context.payload.issue.number;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('number', prNumber);
            core.setOutput('base_sha', pr.base.sha);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_ref', pr.head.ref);

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Prepare PR diff
        run: |
          git diff --stat ${{ steps.pr.outputs.base_sha }}...${{ steps.pr.outputs.head_sha }} > /tmp/pr-stat.txt
          git diff ${{ steps.pr.outputs.base_sha }}...${{ steps.pr.outputs.head_sha }} > /tmp/pr.diff
          if [ "$(wc -c < /tmp/pr.diff)" -gt 500000 ]; then
            head -c 500000 /tmp/pr.diff > /tmp/pr.diff.trimmed
            echo -e "\n\n[diff truncated to 500KB]" >> /tmp/pr.diff.trimmed
            mv /tmp/pr.diff.trimmed /tmp/pr.diff
          fi

      - name: Run Claude Code review
        env:
          ANTHROPIC_BASE_URL: http://127.0.0.1:11434/anthropic
          ANTHROPIC_API_KEY: unused
          ANTHROPIC_AUTH_TOKEN: unused
          CLAUDE_CODE_GLOB_NO_IGNORE: "false"
        run: |
          claude -p --dangerously-skip-permissions --max-turns 30 \
            "Review this pull request. The base branch is \`${{ steps.pr.outputs.base_ref }}\` and the head branch is \`${{ steps.pr.outputs.head_ref }}\`. \
            Base SHA: ${{ steps.pr.outputs.base_sha }}, Head SHA: ${{ steps.pr.outputs.head_sha }}. \
            Diff summary is in /tmp/pr-stat.txt and the full diff is in /tmp/pr.diff. \
            Start from those files. Only read additional source files when needed to understand a change. \
            Do not read node_modules, dist, data, logs, package-lock.json, wasm, or binary files. \
            Provide a concise code review with: \
            1) Summary of changes \
            2) Issues found (bugs, security, performance) \
            3) Suggestions for improvement \
            Be concise and direct. Start your review with the exact marker REVIEW_START on its own line." \
            > review.md 2>&1

      - name: Post review comment to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');

            let review;
            try {
              const raw = fs.readFileSync('review.md', 'utf8');
              const marker = 'REVIEW_START';
              const idx = raw.indexOf(marker);
              review = idx !== -1 ? raw.substring(idx + marker.length).trim() : raw.trim();
            } catch (e) {
              review = '';
            }

            if (!review) {
              console.log('No review content found, posting fallback message');
              review = 'Review completed but no output was captured. Check the workflow run logs.';
            }

            const prNumber = ${{ steps.pr.outputs.number }};
            const triggerLabel = '${{ github.event_name }}' === 'pull_request'
              ? 'PR updated'
              : 'Review requested via comment';

            const body = `## 🤖 Claude Code Review\n\n*${triggerLabel}*\n\n${review}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-review-logs
          path: |
            review.md
            /tmp/obossyk-proxy.log
            /tmp/obossyk-data/traffic-log.jsonl
            /tmp/pr-stat.txt
            /tmp/pr.diff
