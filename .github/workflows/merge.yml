name: Merge

# Triggered by /merge slash command, workflow_dispatch, or automatically
# when review is marked as complete (👍 / STATUS_CLEAN).

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to squash-merge'
        required: true
        type: string

concurrency:
  group: merge-pr-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  merge:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '/merge') &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.user.login == 'github-actions[bot]'
        ))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Resolve PR details
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            if (context.eventName === 'issue_comment') {
              prNumber = context.payload.issue.number;
            } else {
              prNumber = Number(core.getInput('pr_number') || process.env.PR_NUMBER);
            }
            if (!prNumber) {
              core.setFailed('Missing PR number');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.merged) {
              core.setOutput('skip', 'true');
              core.info(`PR #${prNumber} is already merged`);
              return;
            }

            if (pr.state !== 'open') {
              core.setOutput('skip', 'true');
              core.info(`PR #${prNumber} is ${pr.state} — skipping merge`);
              return;
            }

            core.setOutput('skip', 'false');
            core.setOutput('number', String(prNumber));
            core.setOutput('title', pr.title);
            core.setOutput('head_sha', pr.head.sha);
        env:
          PR_NUMBER: ${{ inputs.pr_number }}

      - name: Verify CI checks passed
        if: steps.pr.outputs.skip != 'true'
        id: checks
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = '${{ steps.pr.outputs.head_sha }}';
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
            });
            const blocked = ['failure', 'action_required', 'timed_out', 'cancelled'];
            const failing = checks.check_runs.filter(c => blocked.includes(c.conclusion));
            if (failing.length > 0) {
              const names = failing.map(c => `${c.name} (${c.conclusion})`).join(', ');
              core.setOutput('skip', 'true');
              core.info(`Skipping merge — ${failing.length} blocked check(s): ${names}`);
              return;
            }
            const pending = checks.check_runs.filter(c => c.conclusion === null);
            if (pending.length > 0) {
              const names = pending.map(c => c.name).join(', ');
              core.warning(`${pending.length} check(s) still pending: ${names}. Merge may fail if branch protection requires them.`);
            }
            core.setOutput('skip', 'false');
            core.info('All completed CI checks passed');

      - name: Squash and merge PR
        if: steps.pr.outputs.skip != 'true' && steps.checks.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.MAGIC_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          PR_TITLE="${{ steps.pr.outputs.title }}"

          echo "Squash-merging PR #${PR_NUMBER}: ${PR_TITLE}"

          # Squash-merge via gh CLI — this squashes all commits and merges to base
          # without generating a merge commit message (--squash + manual commit).
          set +e
          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch \
            --subject "${PR_TITLE} (#${PR_NUMBER})" \
            --body ""
          MERGE_EXIT=$?
          set -e
          if [ "$MERGE_EXIT" -ne 0 ]; then
            echo "::error::gh pr merge failed with exit code $MERGE_EXIT"
            exit $MERGE_EXIT
          fi

          echo "PR #${PR_NUMBER} squash-merged successfully"

      - name: Post merge confirmation
        if: steps.pr.outputs.skip != 'true' && steps.checks.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number('${{ steps.pr.outputs.number }}');
            const prTitle = ${{ toJSON(steps.pr.outputs.title) }};

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `✅ Squash-merged \`${prTitle}\` into master.`,
            });

      - name: Skip message
        if: steps.pr.outputs.skip == 'true' || steps.checks.outputs.skip == 'true'
        run: |
          if [ "${{ steps.checks.outputs.skip }}" = "true" ]; then
            echo "Skipping merge — CI checks are failing"
          else
            echo "Skipping merge — PR is already merged or closed"
          fi
