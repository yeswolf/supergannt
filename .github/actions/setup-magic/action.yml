name: 'Setup Proxy'
description: 'Clones, builds and starts the magic service for Claude Code'
inputs:
  magic-token:
    description: 'GitHub token for cloning the magic repository'
    required: true
  bearer-token:
    description: 'Magic bearer token(s) — single token or JSON array'
    required: true
  data-dir:
    description: 'Directory for magic data'
    required: false
    default: '/tmp/magic-data'
runs:
  using: 'composite'
  steps:
    - name: Checkout magic (master)
      uses: actions/checkout@v4
      with:
        repository: yeswolf/magic
        ref: master
        path: magic
        token: ${{ inputs.magic-token }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build magic
      run: |
        cd magic
        npm ci
        npm run build
      shell: bash

    - name: Start magic
      env:
        DATA_DIR: ${{ inputs.data-dir }}
        MAGIC_BEARER_TOKEN: ${{ inputs.bearer-token }}
        # Pace from completion *end* (min-gap alone is a no-op when turns take >1s).
        DEEPSEEK_COMPLETION_END_GAP_MS: "300"
      run: |
        mkdir -p "$DATA_DIR"
        cd magic
        nohup node dist/main.js > /tmp/magic-proxy.log 2>&1 &
        for i in $(seq 1 30); do
          if curl -sf http://127.0.0.1:11434/api/health >/dev/null 2>&1; then
            echo "magic ready (end-gap=${DEEPSEEK_COMPLETION_END_GAP_MS}ms)"
            cp /tmp/magic-proxy.log /tmp/magic-magic.log 2>/dev/null || true
            exit 0
          fi
          sleep 0.5
        done
        echo "magic failed to start" >&2
        tail -80 /tmp/magic-proxy.log >&2
        exit 1
      shell: bash
