<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SuperGantt</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f6cbd;
        color: #fff;
        font-family: "Segoe UI", system-ui, sans-serif;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 1.5rem;
      }
      p {
        margin: 0.35rem 0;
        max-width: 28rem;
        line-height: 1.4;
      }
      .muted {
        opacity: 0.85;
        font-size: 0.92rem;
      }
    </style>
  </head>
  <body>
    <div>
      <p>Starting SuperGantt…</p>
      <p class="muted">
        Loading the workspace…
      </p>
    </div>
  </body>
</html>
