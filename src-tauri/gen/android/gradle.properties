# Project-wide Gradle settings — tuned for fast iterative APK builds.
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.workers.max=8

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.nonFinalResIds=false

# Phone APK target (script also passes -PabiList=… for Rust tasks).
abiList=arm64-v8a
archList=arm64
targetList=aarch64

kotlin.incremental=true
android.enableJetifier=false
